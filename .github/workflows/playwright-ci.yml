name: Playwright Tests

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

jobs:
  Test:
    timeout-minutes: 60
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Code Quality & Linting Gate
        run: npm run lint

      - name: TypeScript Typecheck
        run: npm run typecheck

      - name: Accessibility Compliance Scan
        run: npm run test:a11y

      - name: Run Full Playwright Test Suites
        run: npx playwright test

      - name: Publish GitHub Actions Step Summary
        if: always()
        run: npx tsx scripts/generate-ci-summary.ts

      - name: Upload HTML test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 14

      - name: Upload Test Traces and Media
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-diagnostics
          path: test-results
          retention-days: 14
